name: 'Get Machine Hosts'
description: 'Get a list of machine hostnames from a CSV configuration file'

inputs:
  csv_file:
    description: 'Path to the CSV file containing machine configuration'
    required: true
    default: '.machines.conf.csv'
  azure_resource_group:
    description: 'Azure resource group name to query for location'
    required: true
  environment_suffix:
    description: 'Suffix appended to VM names, matching the Terraform environment_suffix variable'
    required: false
    default: ''

outputs:
  hosts_fqdn_csv:
    description: 'Comma-separated list of machine FQDNs'
    value: ${{ steps.generate.outputs.hosts_fqdn_csv }}
  hosts_json:
    description: 'JSON array of machine FQDNs for matrix strategy'
    value: ${{ steps.generate.outputs.hosts_json }}
  location:
    description: 'Azure region of the resource group'
    value: ${{ steps.generate.outputs.location }}

runs:
  using: 'composite'
  steps:
    - name: Generate host list from CSV
      id: generate
      shell: bash
      env:
        CSV_FILE: ${{ inputs.csv_file }}
        AZURE_RESOURCE_GROUP: ${{ inputs.azure_resource_group }}
        ENVIRONMENT_SUFFIX: ${{ inputs.environment_suffix }}
      run: |
        # Check if CSV file exists
        if [ ! -f "$CSV_FILE" ]; then
          echo "Error: $CSV_FILE does not exist"
          exit 1
        fi

        # Get Azure location
        LOCATION=$(az group show --name "$AZURE_RESOURCE_GROUP" --query location -o tsv)
        if [ -z "$LOCATION" ]; then
          echo "Error: Could not retrieve location for resource group $AZURE_RESOURCE_GROUP"
          exit 1
        fi
        echo "Using location: $LOCATION"

        # Generate hostname list from CSV
        hosts_array=()
        while IFS=, read -r slesVersion spVersion; do
          # Skip header and empty lines
          if [ "$slesVersion" = "slesVersion" ] || [ -z "$slesVersion" ]; then
            continue
          fi

          # Trim whitespace and carriage returns
          slesVersion=$(echo "$slesVersion" | tr -d '\r' | xargs)
          spVersion=$(echo "$spVersion" | tr -d '\r' | xargs)

          vm_name="trento${slesVersion}sp${spVersion}${ENVIRONMENT_SUFFIX}"
          hosts_array+=("${vm_name}.${LOCATION}.cloudapp.azure.com")
        done < "$CSV_FILE"

        # Check if we found any hosts
        if [ ${#hosts_array[@]} -eq 0 ]; then
          echo "Error: No machines found in $CSV_FILE"
          exit 1
        fi

        # Generate comma-separated FQDN list with location
        hosts_fqdn_csv=$(IFS=','; echo "${hosts_array[*]}")

        # Generate JSON array for the e2e test matrix
        hosts_json="[$(printf '"%s",' "${hosts_array[@]}" | sed 's/,$//')]"

        # Set output
        echo "hosts_fqdn_csv=$hosts_fqdn_csv" >> $GITHUB_OUTPUT
        echo "hosts_json=$hosts_json" >> $GITHUB_OUTPUT
        echo "location=$LOCATION" >> $GITHUB_OUTPUT

        echo "Generated FQDN list for ${#hosts_array[@]} machines: $hosts_fqdn_csv"
        echo "Generated hosts JSON for matrix: $hosts_json"
