name: 'Run Cypress tests'
description: 'Execute Cypress tests against a Trento host and upload failure screenshots'

inputs:
  host:
    description: 'Trento host FQDN used as Cypress baseUrl'
    required: true
  photofinish_path:
    description: 'Path to the installed photofinish binary'
    required: true
  expose:
    description: 'Cypress expose parameter, without photofinish_binary'
    required: true
  browser:
    description: 'Path to the browser binary used to run Cypress'
    required: true
  spec:
    description: 'Cypress spec pattern to run'
    required: false
    default: ''
  screenshots_artifact_name:
    description: 'Name of the uploaded screenshots artifact'
    required: true

runs:
  using: 'composite'
  steps:
    - name: Cypress run
      uses: cypress-io/github-action@4ce68f262a3888d22cf3175d62010a145ba737ee # v7.4.8
      env:
        cypress_video: false
      with:
        working-directory: trento-web/test/e2e
        browser: ${{ inputs.browser }}
        wait-on-timeout: 30
        config: baseUrl=https://${{ inputs.host }},retries=1
        expose: photofinish_binary=${{ inputs.photofinish_path }},${{ inputs.expose }}
        spec: ${{ inputs.spec }}

    - name: Upload cypress test screenshots
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      if: failure()
      with:
        name: ${{ inputs.screenshots_artifact_name }}
        path: trento-web/test/e2e/cypress/screenshots/
        retention-days: 1
