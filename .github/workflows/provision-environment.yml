name: Provision & Test Environment
run-name: Provision & test environment ${{ inputs.environment_name }}

on:
  workflow_dispatch:
    inputs:
      environment_name:
        description: 'Name of the environment to provision. Creates resource group trento-env-<name> and names the VMs trento<sles>sp<sp>-<name>.'
        type: string
        required: true
      sles_15_sp4:
        description: 'Deploy to SLES 15 SP4'
        type: boolean
        default: true
      sles_15_sp5:
        description: 'Deploy to SLES 15 SP5'
        type: boolean
        default: true
      sles_15_sp6:
        description: 'Deploy to SLES 15 SP6'
        type: boolean
        default: true
      sles_15_sp7:
        description: 'Deploy to SLES 15 SP7'
        type: boolean
        default: true
      sles_16_0:
        description: 'Deploy to SLES 16'
        type: boolean
        default: true
      install_rolling:
        description: 'Install Trento from the rolling repository instead of the RPMs in Azure Blob Storage'
        type: boolean
        default: false
      provision_only:
        description: 'Provision infrastructure only (skip Trento deployment)'
        type: boolean
        default: false
      skip_cypress:
        description: 'Skip the Cypress full test suite'
        type: boolean
        default: false
      skip_alerting_tests:
        description: 'Skip the alerting Cypress jobs (cypress-alerting-from-env and cypress-alerting-from-ui)'
        type: boolean
        default: false
      cypress_spec:
        description: 'Cypress spec pattern to run. Leave empty to run the full suite.'
        type: string
        default: ''
      web_ref:
        description: 'Branch, tag or commit of trento-project/web to take the Cypress tests from. Leave empty to use its default branch.'
        type: string
        default: ''

# One group per state blob: runs of the same environment serialise instead of racing on its resource group.
concurrency:
  group: ${{ format('trento-installation-tests-{0}', inputs.environment_name) }}
  cancel-in-progress: false

jobs:
  create-resource-group:
    name: Create resource group
    runs-on: ubuntu-24.04

    permissions:
      contents: read

    outputs:
      resource_group: ${{ steps.names.outputs.resource_group }}
      location: ${{ steps.create.outputs.location }}
      os_versions: ${{ steps.select-os-versions.outputs.os_versions }}

    env:
      ENVIRONMENT_NAME: ${{ inputs.environment_name }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Same validation as the environment_suffix variable in terraform/variables.tf.
      - name: Validate environment name
        id: names
        run: |
          if ! [[ "$ENVIRONMENT_NAME" =~ ^[a-z0-9]([a-z0-9-]*[a-z0-9])?$ ]]; then
            echo "Error: environment_name must be lowercase alphanumeric or hyphens, and must not start or end with a hyphen." >&2
            exit 1
          fi
          echo "resource_group=trento-env-${ENVIRONMENT_NAME}" >> "$GITHUB_OUTPUT"

      - name: Select OS versions
        id: select-os-versions
        uses: ./.github/actions/select-os-versions
        with:
          sles_15_sp4: ${{ inputs.sles_15_sp4 }}
          sles_15_sp5: ${{ inputs.sles_15_sp5 }}
          sles_15_sp6: ${{ inputs.sles_15_sp6 }}
          sles_15_sp7: ${{ inputs.sles_15_sp7 }}
          sles_16_0: ${{ inputs.sles_16_0 }}

      - name: Azure Login
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Create or reuse resource group
        id: create
        env:
          RESOURCE_GROUP: ${{ steps.names.outputs.resource_group }}
          BACKEND_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
          OWNER_TAG: ${{ vars.AZURE_OWNER_TAG }}
          CREATED_BY: ${{ github.actor }}
          MANAGED_BY_TAG: trento-installation-automation
        run: |
          RG_EXISTS=$(az group exists --name "$RESOURCE_GROUP")

          # A reused group keeps its own location; a new one is created next to the backend group.
          if [[ "$RG_EXISTS" == 'true' ]]; then
            LOCATION=$(az group show --name "$RESOURCE_GROUP" --query location -o tsv)
          else
            LOCATION=$(az group show --name "$BACKEND_RESOURCE_GROUP" --query location -o tsv)
          fi
          if [ -z "$LOCATION" ]; then
            echo "Error: Could not retrieve the location for the resource group" >&2
            exit 1
          fi

          # The FQDN is the CN of the host certificate, which OpenSSL limits to 64 characters.
          FQDN_SUFFIX=".${LOCATION}.cloudapp.azure.com"
          # 12 is the length of the host name prefix, e.g. 'trento15sp7-' (trento<major>sp<minor>-).
          MAX_NAME_LENGTH=$(( 64 - ${#FQDN_SUFFIX} - 12 ))
          if (( ${#ENVIRONMENT_NAME} > MAX_NAME_LENGTH )); then
            echo "Error: environment_name must be at most $MAX_NAME_LENGTH characters long in $LOCATION so the host FQDN fits in a 64 character certificate CN." >&2
            exit 1
          fi

          # An existing group is only reused when this automation created it; the base workflow
          # destroys its Terraform-managed infrastructure before applying again.
          if [[ "$RG_EXISTS" == 'true' ]]; then
            MANAGED_BY=$(az group show --name "$RESOURCE_GROUP" --query 'tags.ManagedBy' -o tsv)
            if [[ "$MANAGED_BY" != "$MANAGED_BY_TAG" ]]; then
              echo "Error: resource group $RESOURCE_GROUP exists but is not tagged ManagedBy=$MANAGED_BY_TAG; refusing to reuse it." >&2
              exit 1
            fi
            echo "::notice::Reusing existing resource group $RESOURCE_GROUP; its infrastructure will be destroyed and provisioned again."
          else
            az group create \
              --name "$RESOURCE_GROUP" \
              --location "$LOCATION" \
              --tags \
                ManagedBy="$MANAGED_BY_TAG" \
                Owner="$OWNER_TAG" \
                Environment="$ENVIRONMENT_NAME" \
                CreatedBy="$CREATED_BY" \
              --output none
          fi

          echo "location=$LOCATION" >> "$GITHUB_OUTPUT"

  provision:
    name: Provision & test environment
    needs: create-resource-group
    uses: ./.github/workflows/trento-installation-base.yml
    with:
      sles_15_sp4: ${{ inputs.sles_15_sp4 }}
      sles_15_sp5: ${{ inputs.sles_15_sp5 }}
      sles_15_sp6: ${{ inputs.sles_15_sp6 }}
      sles_15_sp7: ${{ inputs.sles_15_sp7 }}
      sles_16_0: ${{ inputs.sles_16_0 }}
      package_source: ${{ inputs.install_rolling && 'rolling' || 'blob_storage' }}
      provision_only: ${{ inputs.provision_only }}
      skip_cypress: ${{ inputs.skip_cypress }}
      skip_alerting_tests: ${{ inputs.skip_alerting_tests }}
      cypress_spec: ${{ inputs.cypress_spec }}
      web_ref: ${{ inputs.web_ref }}
      destroy_after: false
      azure_resource_group: ${{ needs.create-resource-group.outputs.resource_group }}
      environment_suffix: ${{ format('-{0}', inputs.environment_name) }}
    secrets: inherit

  summary:
    name: Publish environment summary
    needs:
      - create-resource-group
      - provision
    if: ${{ !cancelled() && needs.create-resource-group.result == 'success' }}
    runs-on: ubuntu-24.04

    steps:
      - name: Write run parameters to the run summary
        env:
          ENVIRONMENT_NAME: ${{ inputs.environment_name }}
          RESOURCE_GROUP: ${{ needs.create-resource-group.outputs.resource_group }}
          LOCATION: ${{ needs.create-resource-group.outputs.location }}
          OS_VERSIONS: ${{ needs.create-resource-group.outputs.os_versions }}
          WEB_REF: ${{ inputs.web_ref }}
          PACKAGE_SOURCE: ${{ inputs.install_rolling && 'rolling' || 'blob_storage' }}
          GH_TOKEN: ${{ github.token }}
        run: |
          WEB_REF="${WEB_REF:-$(gh api repos/trento-project/web --jq .default_branch || echo '<default branch>')}"
          {
            echo "## Environment \`$ENVIRONMENT_NAME\`"
            echo
            echo "| Parameter | Value |"
            echo "| --- | --- |"
            echo "| Resource group | \`$RESOURCE_GROUP\` |"
            echo "| Package source | \`$PACKAGE_SOURCE\` |"
            echo "| Web ref | \`$WEB_REF\` |"
            echo
            echo "Hosts:"
            while IFS= read -r version; do
              [ -z "$version" ] && continue
              echo "- SLES ${version}: \`trento${version%%.*}sp${version##*.}-${ENVIRONMENT_NAME}.${LOCATION}.cloudapp.azure.com\`"
            done <<< "$OS_VERSIONS"
            echo
            echo "The environment is kept after the run. Delete the resource group \`${RESOURCE_GROUP}\` when you are done."
          } >> "$GITHUB_STEP_SUMMARY"
