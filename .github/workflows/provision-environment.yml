name: Provision Environment
run-name: Provision environment ${{ inputs.environment_name }}

on:
  workflow_dispatch:
    inputs:
      environment_name:
        description: 'Name of the environment to provision. Creates resource group trento-env-<name> and names the VMs trento<sles>sp<sp>-<name>.'
        type: string
        required: true
      sles_15_sp4:
        description: 'Deploy to SLES 15 SP4'
        type: boolean
        default: true
      sles_15_sp5:
        description: 'Deploy to SLES 15 SP5'
        type: boolean
        default: true
      sles_15_sp6:
        description: 'Deploy to SLES 15 SP6'
        type: boolean
        default: true
      sles_15_sp7:
        description: 'Deploy to SLES 15 SP7'
        type: boolean
        default: true
      sles_16_0:
        description: 'Deploy to SLES 16'
        type: boolean
        default: true
      install_rolling:
        description: 'Install Trento from the rolling repository instead of the RPMs in Azure Blob Storage'
        type: boolean
        default: false
      provision_only:
        description: 'Provision infrastructure only (skip Trento deployment)'
        type: boolean
        default: false
      skip_cypress:
        description: 'Skip the Cypress full test suite'
        type: boolean
        default: true
      skip_alerting_tests:
        description: 'Skip the alerting Cypress jobs (cypress-alerting-from-env and cypress-alerting-from-ui)'
        type: boolean
        default: true
      cypress_spec:
        description: 'Cypress spec pattern to run. Leave empty to run the full suite.'
        type: string
        default: ''
      web_ref:
        description: 'Branch, tag or commit of trento-project/web to take the Cypress tests from. Leave empty to use its default branch.'
        type: string
        default: ''

# One group per state blob: runs of the same environment serialise, so the second one fails the
# existence check. Shared with the Destroy Environment workflow.
concurrency:
  group: ${{ format('trento-installation-tests-{0}', inputs.environment_name) }}
  cancel-in-progress: false

jobs:
  create-resource-group:
    name: Create resource group
    runs-on: ubuntu-24.04

    permissions:
      contents: read

    outputs:
      resource_group: ${{ steps.names.outputs.resource_group }}
      location: ${{ steps.create.outputs.location }}
      os_versions: ${{ steps.select-os-versions.outputs.os_versions }}

    env:
      ENVIRONMENT_NAME: ${{ inputs.environment_name }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The name becomes the environment_suffix, so it must also satisfy terraform/variables.tf.
      - name: Validate environment name
        id: names
        run: |
          if ! [[ "$ENVIRONMENT_NAME" =~ ^[a-z0-9]([a-z0-9-]*[a-z0-9])?$ ]]; then
            echo "Error: environment_name must be lowercase alphanumeric or hyphens, and must not start or end with a hyphen." >&2
            exit 1
          fi
          if (( ${#ENVIRONMENT_NAME} > 40 )); then
            echo "Error: environment_name must be at most 40 characters long." >&2
            exit 1
          fi
          echo "resource_group=trento-env-${ENVIRONMENT_NAME}" >> "$GITHUB_OUTPUT"

      - name: Select OS versions
        id: select-os-versions
        uses: ./.github/actions/select-os-versions
        with:
          sles_15_sp4: ${{ inputs.sles_15_sp4 }}
          sles_15_sp5: ${{ inputs.sles_15_sp5 }}
          sles_15_sp6: ${{ inputs.sles_15_sp6 }}
          sles_15_sp7: ${{ inputs.sles_15_sp7 }}
          sles_16_0: ${{ inputs.sles_16_0 }}

      - name: Azure Login
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Check resource group does not exist
        env:
          RESOURCE_GROUP: ${{ steps.names.outputs.resource_group }}
        run: |
          if [[ "$(az group exists --name "$RESOURCE_GROUP")" == 'true' ]]; then
            echo "Error: resource group $RESOURCE_GROUP already exists; destroy it first or choose another environment_name." >&2
            exit 1
          fi

      - name: Create resource group
        id: create
        env:
          RESOURCE_GROUP: ${{ steps.names.outputs.resource_group }}
          BACKEND_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
          OWNER_TAG: ${{ vars.AZURE_OWNER_TAG }}
          CREATED_BY: ${{ github.actor }}
        run: |
          LOCATION=$(az group show --name "$BACKEND_RESOURCE_GROUP" --query location -o tsv)
          if [ -z "$LOCATION" ]; then
            echo "Error: Could not retrieve location for resource group $BACKEND_RESOURCE_GROUP" >&2
            exit 1
          fi

          az group create \
            --name "$RESOURCE_GROUP" \
            --location "$LOCATION" \
            --tags \
              ManagedBy=trento-installation-automation \
              Owner="$OWNER_TAG" \
              Environment="$ENVIRONMENT_NAME" \
              CreatedBy="$CREATED_BY" \
            --output none

          echo "location=$LOCATION" >> "$GITHUB_OUTPUT"

  provision:
    name: Provision environment
    needs: create-resource-group
    uses: ./.github/workflows/trento-installation-base.yml
    with:
      sles_15_sp4: ${{ inputs.sles_15_sp4 }}
      sles_15_sp5: ${{ inputs.sles_15_sp5 }}
      sles_15_sp6: ${{ inputs.sles_15_sp6 }}
      sles_15_sp7: ${{ inputs.sles_15_sp7 }}
      sles_16_0: ${{ inputs.sles_16_0 }}
      package_source: ${{ inputs.install_rolling && 'rolling' || 'blob_storage' }}
      provision_only: ${{ inputs.provision_only }}
      skip_cypress: ${{ inputs.skip_cypress }}
      skip_alerting_tests: ${{ inputs.skip_alerting_tests }}
      cypress_spec: ${{ inputs.cypress_spec }}
      web_ref: ${{ inputs.web_ref }}
      destroy_after: false
      azure_resource_group: ${{ needs.create-resource-group.outputs.resource_group }}
      environment_suffix: ${{ format('-{0}', inputs.environment_name) }}
    secrets: inherit

  summary:
    name: Publish environment summary
    needs:
      - create-resource-group
      - provision
    if: ${{ !cancelled() && needs.create-resource-group.result == 'success' }}
    runs-on: ubuntu-24.04

    steps:
      - name: Write run parameters to the run summary
        env:
          ENVIRONMENT_NAME: ${{ inputs.environment_name }}
          RESOURCE_GROUP: ${{ needs.create-resource-group.outputs.resource_group }}
          LOCATION: ${{ needs.create-resource-group.outputs.location }}
          OS_VERSIONS: ${{ needs.create-resource-group.outputs.os_versions }}
          PACKAGE_SOURCE: ${{ inputs.install_rolling && 'rolling' || 'blob_storage' }}
          PROVISION_ONLY: ${{ inputs.provision_only }}
          SKIP_CYPRESS: ${{ inputs.skip_cypress }}
          SKIP_ALERTING_TESTS: ${{ inputs.skip_alerting_tests }}
          CYPRESS_SPEC: ${{ inputs.cypress_spec }}
          WEB_REF: ${{ inputs.web_ref }}
          LAUNCHED_BY: ${{ github.actor }}
        run: |
          {
            echo "## Environment \`$ENVIRONMENT_NAME\`"
            echo
            echo "| Parameter | Value |"
            echo "| --- | --- |"
            echo "| Resource group | \`$RESOURCE_GROUP\` |"
            echo "| Launched by | $LAUNCHED_BY |"
            echo "| Web ref | \`${WEB_REF:-<default branch>}\` |"
            echo
            echo "Hosts:"
            while IFS= read -r version; do
              [ -z "$version" ] && continue
              echo "- SLES ${version}: \`trento${version%%.*}sp${version##*.}-${ENVIRONMENT_NAME}.${LOCATION}.cloudapp.azure.com\`"
            done <<< "$OS_VERSIONS"
            echo
            echo "The environment is kept after the run. Destroy it with the *Destroy Environment* workflow."
          } >> "$GITHUB_STEP_SUMMARY"
