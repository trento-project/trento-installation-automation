name: Control Container Probe

on:
  workflow_dispatch:
  push:
    branches:
      - use-containers-as-control-nodes
    paths:
      - .github/workflows/control-container-probe.yml

jobs:
  probe:
    name: Probe ${{ matrix.image }}
    runs-on: ubuntu-24.04
    container:
      image: ${{ matrix.image }}
    strategy:
      fail-fast: false
      matrix:
        image:
          - registry.suse.com/bci/bci-base:15.6
          - registry.suse.com/bci/bci-base:15.7
          - registry.suse.com/bci/bci-base:16.0
    env:
      REGISTRATION_CODE: ${{ secrets.SUSE_REGISTRATION_CODE }}
      REGISTRATION_EMAIL: ${{ secrets.SUSE_REGISTRATION_EMAIL }}

    steps:
      - name: Show base product
        run: |
          cat /etc/os-release
          ls /etc/products.d/ || true

      - name: Install SUSEConnect
        run: |
          zypper -n in -y suseconnect-ng || zypper -n in -y SUSEConnect
          command -v SUSEConnect

      - name: Register
        run: SUSEConnect -r "$REGISTRATION_CODE" -e "$REGISTRATION_EMAIL"

      - name: Search Ansible packages in registered repos
        run: zypper -n se -s ansible ansible-core ansible-linux-system-roles ansible-trento || true

      - name: Add rolling repository
        run: |
          source /etc/os-release
          if [ "${VERSION_ID%%.*}" = "16" ]; then
            REPO_URL="https://download.opensuse.org/repositories/devel:/sap:/trento:/factory/SLES16.0/devel:sap:trento:factory.repo"
          else
            REPO_URL="https://download.opensuse.org/repositories/devel:sap:trento:factory/SLES15-Trento-SP3-SP7/devel:sap:trento:factory.repo"
          fi
          zypper -n addrepo "$REPO_URL"
          zypper -n modifyrepo --priority 1 devel_sap_trento_factory
          if [ "${VERSION_ID%%.*}" != "16" ]; then
            zypper -n addrepo "https://download.opensuse.org/repositories/devel:/sap:/trento:/factory/SLES15-SP5/" devel_sap_trento_factory_ansible
            zypper -n modifyrepo --priority 1 devel_sap_trento_factory_ansible
          fi
          zypper -n --gpg-auto-import-keys refresh

      - name: Install ansible-trento
        run: zypper -n --gpg-auto-import-keys in -y --auto-agree-with-licenses ansible-trento

      - name: Show Ansible versions
        run: |
          ansible --version
          ansible-galaxy collection list suse.trento
          ls /usr/share/ansible/roles

      - name: Deregister
        if: always()
        run: SUSEConnect -d || true
