name: Continuous Integration

on:
  push:
    branches:
      - main
    paths-ignore:
      - '**.adoc'
      - 'LICENSE'
  pull_request:
    types: [opened, synchronize]
    paths-ignore:
      - '**.adoc'
      - 'LICENSE'
  workflow_dispatch:

# Superseded runs are queued instead of cancelled: cancelling mid `terraform apply` leaves
# an orphaned state lock and resources that the state file never recorded.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ci:
    name: Run deployments & tests
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    uses: ./.github/workflows/trento-installation-base.yml
    with:
      install_rolling: true
      cypress_spec: '**/about.cy.js'
      destroy_after: true
    secrets: inherit
