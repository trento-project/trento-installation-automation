name: Continuous Integration

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize]
  workflow_dispatch:

# Superseded runs are queued instead of canceled: canceling mid `terraform apply` leaves
# an orphaned state lock and resources that the state file never recorded.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ci:
    name: Run deployments & tests
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    uses: ./.github/workflows/trento-installation-base.yml
    with:
      install_rolling: true
      cypress_spec: '**/about.cy.js'
      destroy_after: true
    secrets: inherit

  # Fixed name to use as the required status check: the Cypress jobs are a
  # matrix and their names embed the target host FQDN.
  ci-passed:
    name: CI passed
    needs: ci
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - run: '[ "${{ needs.ci.result }}" = success ]'
