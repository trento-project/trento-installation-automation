name: Continuous Integration

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize]
  workflow_dispatch:

# Superseded runs are queued instead of canceled: canceling mid `terraform apply` leaves
# an orphaned state lock and resources that the state file never recorded.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ci:
    name: Run deployments & tests
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    uses: ./.github/workflows/trento-installation-base.yml
    with:
      # Action bumps only affect the runner, not the target OS. Test SLES 15 SP7
      # as a CI sanity check (most widely adopted).
      sles_15_sp4: &not_dependabot ${{ github.actor != 'dependabot[bot]' && github.event.pull_request.user.login != 'dependabot[bot]' }}
      sles_15_sp5: *not_dependabot
      sles_15_sp6: *not_dependabot
      sles_15_sp7: true
      sles_16_0: *not_dependabot
      package_source: 'rolling'
      skip_alerting_tests: true
      cypress_spec: '**/about.cy.js'
      destroy_after: true
    secrets: inherit

  # Fixed name to use as the required status check: the Cypress jobs are a
  # matrix and their names embed the host FQDN.
  ci-passed:
    name: CI passed
    needs: ci
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - run: '[ "${{ needs.ci.result }}" = success ]'
