name: Terraform Destroy

# Reusable. The caller is responsible for the concurrency group of the environment.
on:
  workflow_call:
    inputs:
      azure_resource_group:
        description: 'Azure resource group the environment was deployed into. Leave empty to use vars.AZURE_RESOURCE_GROUP.'
        type: string
        default: ''
      environment_suffix:
        description: 'Suffix appended to VM and network resource names (e.g. -foo). Also selects the Terraform state blob terraform<suffix>.tfstate.'
        type: string
        default: ''

env:
  AZURE_BLOB_STORAGE: ${{ vars.AZURE_BLOB_STORAGE }}
  AZURE_BLOB_STORAGE_TF_STATE_CONTAINER: ${{ vars.AZURE_BLOB_STORAGE_TF_STATE_CONTAINER }}

jobs:
  terraform-destroy:
    name: Terraform Destroy
    runs-on: ubuntu-24.04

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Mirrors the environment_suffix validation in terraform/variables.tf, which
      # runs too late: the suffix already names the state blob at init time.
      - name: Validate environment suffix
        env:
          ENVIRONMENT_SUFFIX: ${{ inputs.environment_suffix }}
        run: |
          if ! [[ "$ENVIRONMENT_SUFFIX" =~ ^[a-z0-9-]*$ ]] || [[ "$ENVIRONMENT_SUFFIX" == *- ]]; then
            echo "Error: environment_suffix must be lowercase alphanumeric or hyphens, and must not end with a hyphen." >&2
            exit 1
          fi

      - name: Generate machines config CSV
        uses: ./.github/actions/generate-machines-config
        with:
          os_versions: |
            15.4
            15.5
            15.6
            15.7
            16.0

      - name: Azure Login
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Extract Azure Credentials
        id: azure-creds
        uses: ./.github/actions/extract-azure-credentials
        with:
          azure_credentials: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Run Terraform Destroy
        uses: ./.github/actions/terraform-destroy
        with:
          azure_resource_group: ${{ inputs.azure_resource_group || vars.AZURE_RESOURCE_GROUP }}
          backend_resource_group: ${{ vars.AZURE_RESOURCE_GROUP }}
          environment_suffix: ${{ inputs.environment_suffix }}
          state_key: ${{ format('terraform{0}.tfstate', inputs.environment_suffix) }}
          azure_owner_tag: ${{ vars.AZURE_OWNER_TAG }}
          ssh_public_key_content: ${{ vars.PUBLIC_SSH_KEY_CONTENT }}
          client_id: ${{ steps.azure-creds.outputs.client_id }}
          client_secret: ${{ steps.azure-creds.outputs.client_secret }}
          tenant_id: ${{ steps.azure-creds.outputs.tenant_id }}
          subscription_id: ${{ steps.azure-creds.outputs.subscription_id }}
