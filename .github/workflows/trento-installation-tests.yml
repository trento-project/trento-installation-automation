name: Trento Installation Tests

on:
  workflow_dispatch:
    inputs:
      sles_15_sp4:
        description: 'Deploy to SLES 15 SP4'
        type: boolean
        default: true
      sles_15_sp5:
        description: 'Deploy to SLES 15 SP5'
        type: boolean
        default: true
      sles_15_sp6:
        description: 'Deploy to SLES 15 SP6'
        type: boolean
        default: true
      sles_15_sp7:
        description: 'Deploy to SLES 15 SP7'
        type: boolean
        default: true
      sles_16_0:
        description: 'Deploy to SLES 16'
        type: boolean
        default: true
      install_rolling:
        description: 'Install rolling version of packages'
        type: boolean
        default: false
      skip_cypress:
        description: 'Skip the Cypress end-to-end tests'
        type: boolean
        default: false
      cypress_spec:
        description: 'Cypress spec pattern to run. Leave empty to run the full suite.'
        type: string
        default: ''
      web_ref:
        description: 'Branch, tag or SHA of trento-project/web to take the Cypress tests from'
        type: string
        default: 'main'
      destroy_after:
        description: 'Destroy Terraform-managed infrastructure after the workflow finishes'
        type: boolean
        default: false

jobs:
  installation-tests:
    name: Run installation tests
    uses: ./.github/workflows/trento-installation-base.yml
    with:
      sles_15_sp4: ${{ inputs.sles_15_sp4 }}
      sles_15_sp5: ${{ inputs.sles_15_sp5 }}
      sles_15_sp6: ${{ inputs.sles_15_sp6 }}
      sles_15_sp7: ${{ inputs.sles_15_sp7 }}
      sles_16_0: ${{ inputs.sles_16_0 }}
      install_rolling: ${{ inputs.install_rolling }}
      skip_cypress: ${{ inputs.skip_cypress }}
      cypress_spec: ${{ inputs.cypress_spec }}
      web_ref: ${{ inputs.web_ref }}
      destroy_after: ${{ inputs.destroy_after }}
    secrets: inherit
