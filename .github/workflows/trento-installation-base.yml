name: Trento Installation Base

on:
  workflow_call:
    inputs:
      sles_15_sp4:
        description: 'Deploy to SLES 15 SP4'
        type: boolean
        default: true
      sles_15_sp5:
        description: 'Deploy to SLES 15 SP5'
        type: boolean
        default: true
      sles_15_sp6:
        description: 'Deploy to SLES 15 SP6'
        type: boolean
        default: true
      sles_15_sp7:
        description: 'Deploy to SLES 15 SP7'
        type: boolean
        default: true
      sles_16_0:
        description: 'Deploy to SLES 16.0'
        type: boolean
        default: true
      package_source:
        description: 'Package repository source to configure on machines (blob_storage or rolling)'
        type: string
        default: 'blob_storage'
      provision_only:
        description: 'Provision infrastructure only (skip Trento deployment)'
        type: boolean
        default: false
      skip_cypress:
        description: 'Skip Cypress full test suite'
        type: boolean
        default: false
      skip_alerting_tests:
        description: 'Skip the alerting Cypress jobs (cypress-alerting-from-env and cypress-alerting-from-ui)'
        type: boolean
        default: false
      cypress_spec:
        description: 'Cypress spec pattern to run. Leave empty to run the full suite.'
        type: string
        default: ''
      web_ref:
        description: 'Branch, tag or commit of trento-project/web to take the Cypress tests from. Leave empty to use its default branch.'
        type: string
        default: ''
      destroy_after:
        description: 'Destroy Terraform-managed infrastructure after the workflow finishes'
        type: boolean
        default: false
concurrency:
  group: trento-installation-tests
  cancel-in-progress: false

env:
  AZURE_BLOB_STORAGE: ${{ vars.AZURE_BLOB_STORAGE }}
  AZURE_BLOB_STORAGE_CONTAINER: ${{ vars.AZURE_BLOB_STORAGE_CONTAINER }}
  AZURE_BLOB_STORAGE_TF_STATE_CONTAINER: ${{ vars.AZURE_BLOB_STORAGE_TF_STATE_CONTAINER }}
  SSH_USERNAME: cloudadmin
  PHOTOFINISH_VERSION: v1.4.2
  # The Trento web instances are enforced to send alerting emails to
  # localhost:1025, a reverse SSH tunnel to the Mailpit on the email tests runner.
  MAILPIT_SMTP_HOST: localhost
  MAILPIT_SMTP_PORT: 1025
  # Must match the credentials hardcoded in the Trento web docker-compose.yaml.
  MAILPIT_SMTP_USER: trentouser
  MAILPIT_SMTP_PASSWORD: pass

jobs:
  provision-and-deploy:
    name: Provision infrastructure & deploy Trento
    runs-on: ubuntu-24.04

    outputs:
      os_versions: ${{ steps.select-os-versions.outputs.os_versions }}
      hosts_json: ${{ steps.get-hosts.outputs.hosts_json }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Select OS versions
        id: select-os-versions
        run: |
          selected_versions=()

          if [[ "${{ inputs.sles_15_sp4 }}" == 'true' ]]; then
            selected_versions+=("15.4")
          fi
          if [[ "${{ inputs.sles_15_sp5 }}" == 'true' ]]; then
            selected_versions+=("15.5")
          fi
          if [[ "${{ inputs.sles_15_sp6 }}" == 'true' ]]; then
            selected_versions+=("15.6")
          fi
          if [[ "${{ inputs.sles_15_sp7 }}" == 'true' ]]; then
            selected_versions+=("15.7")
          fi
          if [[ "${{ inputs.sles_16_0 }}" == 'true' ]]; then
            selected_versions+=("16.0")
          fi

          if [ ${#selected_versions[@]} -eq 0 ]; then
            echo "Error: Select at least one supported SLES version." >&2
            exit 1
          fi

          {
            echo "os_versions<<EOF"
            printf '%s\n' "${selected_versions[@]}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Generate machines config CSV
        uses: ./.github/actions/generate-machines-config
        with:
          os_versions: ${{ steps.select-os-versions.outputs.os_versions }}

      - name: Setup SSH keys
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.PRIVATE_SSH_KEY_CONTENT }}" > ~/.ssh/id_rsa
          echo "${{ vars.PUBLIC_SSH_KEY_CONTENT }}" > ~/.ssh/id_rsa.pub
          chmod 600 ~/.ssh/id_rsa
          chmod 644 ~/.ssh/id_rsa.pub

      - name: Azure Login
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Extract Azure Credentials
        id: azure-creds
        uses: ./.github/actions/extract-azure-credentials
        with:
          azure_credentials: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Parse tool versions
        uses: endorama/asdf-parse-tool-versions@115a5df5884438dfd08a3a21e9c9efdf06dd907e # v1.7.0

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}

      - name: Terraform Format Check
        id: fmt
        working-directory: ./terraform
        run: terraform fmt -check -recursive
        continue-on-error: true

      - name: Terraform Init
        id: init
        working-directory: ./terraform
        run: |
          terraform init \
            -backend-config="storage_account_name=${{ env.AZURE_BLOB_STORAGE }}" \
            -backend-config="container_name=${{ env.AZURE_BLOB_STORAGE_TF_STATE_CONTAINER }}" \
            -backend-config="key=terraform.tfstate" \
            -backend-config="resource_group_name=${{ vars.AZURE_RESOURCE_GROUP }}" \
            -backend-config="client_id=${{ steps.azure-creds.outputs.client_id }}" \
            -backend-config="client_secret=${{ steps.azure-creds.outputs.client_secret }}" \
            -backend-config="tenant_id=${{ steps.azure-creds.outputs.tenant_id }}" \
            -backend-config="subscription_id=${{ steps.azure-creds.outputs.subscription_id }}"

      - name: Terraform Validate
        id: validate
        working-directory: ./terraform
        run: terraform validate -no-color

      - name: Set ARM_SUBSCRIPTION_ID
        id: subscription
        run: |
          ARM_SUBSCRIPTION_ID=$(az account show --query id -o tsv)
          if [ -z "$ARM_SUBSCRIPTION_ID" ]; then
            echo "Error: Could not retrieve subscription ID from Azure CLI"
            exit 1
          fi
          echo "ARM_SUBSCRIPTION_ID=$ARM_SUBSCRIPTION_ID" >> $GITHUB_ENV
          echo "Subscription ID set successfully"

      - name: Terraform Destroy
        working-directory: ./terraform
        run: terraform destroy -auto-approve -input=false
        env:
          TF_VAR_azure_resource_group: ${{ vars.AZURE_RESOURCE_GROUP }}
          TF_VAR_azure_owner_tag: ${{ vars.AZURE_OWNER_TAG }}
          TF_VAR_ssh_public_key_content: ${{ vars.PUBLIC_SSH_KEY_CONTENT }}
          TF_VAR_ssh_private_key_content: ""

      - name: Terraform Plan
        id: plan
        working-directory: ./terraform
        run: terraform plan -no-color -out=tfplan -input=false
        env:
          TF_VAR_azure_resource_group: ${{ vars.AZURE_RESOURCE_GROUP }}
          TF_VAR_azure_owner_tag: ${{ vars.AZURE_OWNER_TAG }}
          TF_VAR_ssh_public_key_content: ${{ vars.PUBLIC_SSH_KEY_CONTENT }}
          TF_VAR_ssh_private_key_content: ${{ secrets.PRIVATE_SSH_KEY_CONTENT }}

      - name: Terraform Apply
        working-directory: ./terraform
        run: terraform apply -auto-approve tfplan
        env:
          TF_VAR_ssh_private_key_content: ${{ secrets.PRIVATE_SSH_KEY_CONTENT }}

      - name: Get machine hosts from CSV
        id: get-hosts
        uses: ./.github/actions/get-machine-hosts
        with:
          csv_file: .machines.conf.csv
          azure_resource_group: ${{ vars.AZURE_RESOURCE_GROUP }}

      - name: Register SUSE machines & activate modules
        id: activate-modules
        uses: ./.github/actions/suse-register-and-activate-modules
        with:
          hosts_fqdn_csv: ${{ steps.get-hosts.outputs.hosts_fqdn_csv }}
          ssh_username: ${{ env.SSH_USERNAME }}
          ssh_private_key: ${{ secrets.PRIVATE_SSH_KEY_CONTENT }}
          registration_code: ${{ secrets.SUSE_REGISTRATION_CODE }}
          registration_email: ${{ secrets.SUSE_REGISTRATION_EMAIL }}

      - name: Setup RPM repository on machines
        id: setup-rpm-repo
        uses: ./.github/actions/setup-rpm-repository
        with:
          hosts_fqdn_csv: ${{ steps.get-hosts.outputs.hosts_fqdn_csv }}
          ssh_username: ${{ env.SSH_USERNAME }}
          ssh_private_key: ${{ secrets.PRIVATE_SSH_KEY_CONTENT }}
          azure_blob_storage: ${{ env.AZURE_BLOB_STORAGE }}
          azure_blob_storage_container: ${{ env.AZURE_BLOB_STORAGE_CONTAINER }}
          azure_blob_storage_sas_token: ${{ secrets.AZURE_BLOB_STORAGE_SAS_TOKEN }}
          package_source: ${{ inputs.package_source }}

      - name: Setup test CA
        id: setup-test-ca
        uses: ./.github/actions/setup-test-ca
        timeout-minutes: 1
        with:
          hosts_fqdn_csv: ${{ steps.get-hosts.outputs.hosts_fqdn_csv }}
          ssh_username: ${{ env.SSH_USERNAME }}
          ssh_private_key: ${{ secrets.PRIVATE_SSH_KEY_CONTENT }}
          ca_cert: ${{ vars.TRENTO_TEST_CA_CRT }}
          ca_key: ${{ secrets.TRENTO_TEST_CA_KEY }}

      - name: Generate Certs & Ansible inventory
        id: ansible-playbook-preparations
        uses: ./.github/actions/ansible-playbook-preparations
        with:
          hosts_fqdn_csv: ${{ steps.get-hosts.outputs.hosts_fqdn_csv }}
          ssh_username: ${{ env.SSH_USERNAME }}
          ssh_private_key: ${{ secrets.PRIVATE_SSH_KEY_CONTENT }}
          web_admin_password: ${{ secrets.WEB_ADMIN_PASSWORD }}
          azure_region: ${{ steps.get-hosts.outputs.location }}
          smtp_server: ${{ env.MAILPIT_SMTP_HOST }}
          smtp_port: ${{ env.MAILPIT_SMTP_PORT }}
          smtp_user: ${{ env.MAILPIT_SMTP_USER }}
          smtp_password: ${{ env.MAILPIT_SMTP_PASSWORD }}

      - name: Run Ansible Trento playbook
        if: ${{ !inputs.provision_only }}
        uses: ./.github/actions/run-ansible-trento-playbook
        with:
          hosts_fqdn_csv: ${{ steps.get-hosts.outputs.hosts_fqdn_csv }}
          ssh_username: ${{ env.SSH_USERNAME }}
          ssh_private_key: ${{ secrets.PRIVATE_SSH_KEY_CONTENT }}

      - name: Verify Trento instances healthcheck endpoints
        if: ${{ !inputs.provision_only }}
        uses: ./.github/actions/verify-trento-health
        with:
          hosts_fqdn_csv: ${{ steps.get-hosts.outputs.hosts_fqdn_csv }}

      - name: Verify Trento supportconfig plugin
        if: ${{ !inputs.provision_only }}
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
        with:
          host: ${{ steps.get-hosts.outputs.hosts_fqdn_csv }}
          username: ${{ env.SSH_USERNAME }}
          key: ${{ secrets.PRIVATE_SSH_KEY_CONTENT }}
          command_timeout: 5m
          script: |
            set -euo pipefail

            NODE_NAME="$(hostname -s)"

            sudo rpm -q supportutils-plugin-trento supportutils > /dev/null

            OUTPUT_FILE="$(mktemp)"
            trap 'rm -f "$OUTPUT_FILE"' EXIT
            sudo supportconfig > "$OUTPUT_FILE"

            if ! grep -Eq "Plugin: trento\.\.\.\s+Done" "$OUTPUT_FILE"; then
              echo "ERROR: Trento supportconfig plugin not found/executed on ${NODE_NAME}" >&2
              exit 1
            fi

  # The installation phase deploys a real agent; clean it up before any Cypress
  # job generates photofinish data to avoid conflicts during tests execution.
  cleanup-agent:
    name: Clean up Trento agent (${{ matrix.host }})
    needs: provision-and-deploy
    if: ${{ needs.provision-and-deploy.result == 'success' && !inputs.provision_only && (!inputs.skip_cypress || !inputs.skip_alerting_tests) }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        host: ${{ fromJson(needs.provision-and-deploy.outputs.hosts_json || '[]') }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Trust test CA certificate
        uses: ./.github/actions/trust-runner-ca
        with:
          ca_cert: ${{ vars.TRENTO_TEST_CA_CRT }}

      - name: Clean up Trento agent from host
        uses: ./.github/actions/cleanup-trento-agent
        with:
          host_fqdn: ${{ matrix.host }}
          ssh_username: ${{ env.SSH_USERNAME }}
          ssh_private_key: ${{ secrets.PRIVATE_SSH_KEY_CONTENT }}
          web_admin_password: ${{ secrets.WEB_ADMIN_PASSWORD }}

  cypress-full-suite:
    name: Cypress Full Suite (${{ matrix.host }})
    needs:
      - provision-and-deploy
      - cleanup-agent
    if: ${{ needs.provision-and-deploy.result == 'success' && !inputs.provision_only && !inputs.skip_cypress }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        host: ${{ fromJson(needs.provision-and-deploy.outputs.hosts_json || '[]') }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Checkout Trento Web tests
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: trento-project/web
          path: trento-web
          ref: ${{ inputs.web_ref }}
          sparse-checkout: |
            /assets/
            /test/e2e/
            /test/fixtures/
            /.photofinish.toml
            /docker-compose.yaml
            /.tool-versions
          sparse-checkout-cone-mode: false

      - name: Setup Cypress tests
        id: setup-cypress-tests
        uses: ./.github/actions/setup-cypress-tests
        with:
          ca_cert: ${{ vars.TRENTO_TEST_CA_CRT }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          photofinish_version: ${{ env.PHOTOFINISH_VERSION }}

      - name: Run Cypress tests
        uses: ./.github/actions/run-cypress-tests
        with:
          host: ${{ matrix.host }}
          photofinish_path: ${{ steps.setup-cypress-tests.outputs.photofinish_path }}
          expose: wanda_mode=prod,web_mode=prod
          spec: ${{ inputs.cypress_spec }}
          screenshots_artifact_name: e2e-screenshots-${{ matrix.host }}

  cypress-alerting-from-env:
    name: Cypress Alerting from Env (${{ matrix.host }})
    needs:
      - provision-and-deploy
      - cleanup-agent
      - cypress-full-suite
    if: ${{ !cancelled() && needs.provision-and-deploy.result == 'success' && needs.cleanup-agent.result == 'success' && !inputs.provision_only && !inputs.skip_alerting_tests }}
    runs-on: ubuntu-24.04
    env:
      COMPOSE_FILE: trento-web/docker-compose.yaml
    strategy:
      fail-fast: false
      matrix:
        host: ${{ fromJson(needs.provision-and-deploy.outputs.hosts_json || '[]') }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Checkout Trento Web tests
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: trento-project/web
          path: trento-web
          ref: ${{ inputs.web_ref }}
          sparse-checkout: |
            /assets/
            /test/e2e/
            /test/fixtures/
            /.photofinish.toml
            /docker-compose.yaml
            /.tool-versions
          sparse-checkout-cone-mode: false

      - name: Setup Mailpit tunnel
        uses: ./.github/actions/setup-mailpit-tunnel
        with:
          host: ${{ matrix.host }}
          ssh_username: ${{ env.SSH_USERNAME }}
          ssh_private_key: ${{ secrets.PRIVATE_SSH_KEY_CONTENT }}
          smtp_port: ${{ env.MAILPIT_SMTP_PORT }}
          ca_cert: ${{ vars.TRENTO_TEST_CA_CRT }}
          ca_key: ${{ secrets.TRENTO_TEST_CA_KEY }}

      - name: Setup Cypress tests
        id: setup-cypress-tests
        uses: ./.github/actions/setup-cypress-tests
        with:
          ca_cert: ${{ vars.TRENTO_TEST_CA_CRT }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          photofinish_version: ${{ env.PHOTOFINISH_VERSION }}

      - name: Run Cypress tests
        uses: ./.github/actions/run-cypress-tests
        with:
          host: ${{ matrix.host }}
          photofinish_path: ${{ steps.setup-cypress-tests.outputs.photofinish_path }}
          expose: wanda_mode=prod,web_mode=prod,ALERTING_TESTS=true
          spec: cypress/e2e/alerting.cy.js
          screenshots_artifact_name: e2e-alerting-env-screenshots-${{ matrix.host }}

      - name: Show Mailpit and tunnel logs
        if: failure()
        run: |
          docker compose logs mailpit
          cat tunnel.log

  cypress-alerting-from-ui:
    name: Cypress Alerting from UI (${{ matrix.host }})
    needs:
      - provision-and-deploy
      - cleanup-agent
      - cypress-full-suite
      - cypress-alerting-from-env
    if: ${{ !cancelled() && needs.provision-and-deploy.result == 'success' && needs.cleanup-agent.result == 'success' && !inputs.provision_only && !inputs.skip_alerting_tests }}
    runs-on: ubuntu-24.04
    env:
      COMPOSE_FILE: trento-web/docker-compose.yaml
    strategy:
      fail-fast: false
      matrix:
        host: ${{ fromJson(needs.provision-and-deploy.outputs.hosts_json || '[]') }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Checkout Trento Web tests
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: trento-project/web
          path: trento-web
          ref: ${{ inputs.web_ref }}
          sparse-checkout: |
            /assets/
            /test/e2e/
            /test/fixtures/
            /.photofinish.toml
            /docker-compose.yaml
            /.tool-versions
          sparse-checkout-cone-mode: false

      - name: Restart Trento Web without alerting environment
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
        with:
          host: ${{ matrix.host }}
          username: ${{ env.SSH_USERNAME }}
          key: ${{ secrets.PRIVATE_SSH_KEY_CONTENT }}
          script: |
            set -euo pipefail

            sudo sed -i '/^\(ENABLE_ALERTING\|SMTP_SERVER\|SMTP_PORT\|SMTP_USER\|SMTP_PASSWORD\|ALERT_SENDER\|ALERT_RECIPIENT\)=/d' /etc/trento/trento-web
            sudo systemctl restart trento-web

            for _ in $(seq 1 30); do
              if curl -fsS http://localhost:4000/api/healthz > /dev/null; then
                exit 0
              fi
              sleep 2
            done

            sudo systemctl status trento-web --no-pager || true
            exit 1

      - name: Setup Mailpit tunnel
        uses: ./.github/actions/setup-mailpit-tunnel
        with:
          host: ${{ matrix.host }}
          ssh_username: ${{ env.SSH_USERNAME }}
          ssh_private_key: ${{ secrets.PRIVATE_SSH_KEY_CONTENT }}
          smtp_port: ${{ env.MAILPIT_SMTP_PORT }}
          ca_cert: ${{ vars.TRENTO_TEST_CA_CRT }}
          ca_key: ${{ secrets.TRENTO_TEST_CA_KEY }}

      - name: Setup Cypress tests
        id: setup-cypress-tests
        uses: ./.github/actions/setup-cypress-tests
        with:
          ca_cert: ${{ vars.TRENTO_TEST_CA_CRT }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          photofinish_version: ${{ env.PHOTOFINISH_VERSION }}

      - name: Run Cypress tests
        uses: ./.github/actions/run-cypress-tests
        with:
          host: ${{ matrix.host }}
          photofinish_path: ${{ steps.setup-cypress-tests.outputs.photofinish_path }}
          expose: wanda_mode=prod,web_mode=prod,ALERTING_DB_TESTS=true,ALERTING_TESTS=true
          spec: cypress/e2e/alerting.cy.js
          screenshots_artifact_name: e2e-alerting-ui-screenshots-${{ matrix.host }}

      - name: Show Mailpit and tunnel logs
        if: failure()
        run: |
          docker compose logs mailpit
          cat tunnel.log

  cleanup:
    name: Destroy infrastructure
    needs:
      - provision-and-deploy
      - cypress-full-suite
      - cypress-alerting-from-env
      - cypress-alerting-from-ui
    if: ${{ always() && inputs.destroy_after }}
    uses: ./.github/workflows/terraform-destroy.yml
    secrets: inherit
